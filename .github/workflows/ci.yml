name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check src tests

      - name: ruff format --check
        run: python -m ruff format --check src tests

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest -v --cov=hcrulepy --cov-report=xml
        # No hashcat binary is available in CI, so tests/test_hashcat_diff.py
        # skips automatically (see its HASHCAT_BIN / PATH lookup). The
        # committed golden fixtures in tests/test_hashcat_golden.py and
        # tests/test_hashcat_verified_functions.py still run and provide
        # real-hashcat-confirmed coverage without needing a binary here.

      # One upload is enough for the badge; the rest of the matrix is there to
      # catch platform and version breakage, not to measure coverage again.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: build sdist/wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
