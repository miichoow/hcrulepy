name: Release

# Publishes hcrulepy to PyPI via PyPI Trusted Publishing (OIDC) — no API
# tokens or stored secrets. See RELEASING.md for the one-time PyPI setup.
#
# Triggers:
#   - Publishing a GitHub Release        -> builds, checks, publishes to PyPI.
#   - Manual run (workflow_dispatch)     -> builds, checks, publishes to the
#     chosen target (default: TestPyPI, for a safe dry run).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package + build tooling
        run: python -m pip install -e ".[dev]" build twine

      - name: Quality gates (never publish a broken build)
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m mypy
          python -m pytest -q

      - name: Verify tag matches package version (release only)
        if: github.event_name == 'release'
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package version: $version"
          echo "release tag    : $GITHUB_REF_NAME (normalized: $tag)"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match project version '$version'. Bump pyproject.toml or fix the tag."
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
